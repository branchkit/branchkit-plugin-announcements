name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gofmt
        working-directory: src
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: src
        run: go vet ./...
      - name: test
        working-directory: src
        run: go test -race ./...
      - name: build
        working-directory: src
        run: go build -o ../announcements-plugin .

  engine:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        working-directory: stages/sherpa-tts
        run: cargo fmt --check
      - name: test
        working-directory: stages/sherpa-tts
        run: cargo test --release
      - name: clippy
        working-directory: stages/sherpa-tts
        run: cargo clippy --release -- -D warnings
