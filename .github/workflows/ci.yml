name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gofmt
        working-directory: src
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        working-directory: src
        run: go vet ./...
      - name: test
        working-directory: src
        run: go test -race ./...
      - name: build
        working-directory: src
        run: go build -o ../announcements-plugin .

  engine:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        working-directory: stages/sherpa-tts
        run: cargo fmt --check
      - name: test
        working-directory: stages/sherpa-tts
        run: cargo test --release
      - name: clippy
        working-directory: stages/sherpa-tts
        run: cargo clippy --release -- -D warnings

  # What a release would ship, built and packaged on every push the way the
  # release workflow does it, for the same targets (keep the two matrices
  # equal), then checked: both programs executable, the
  # engine's licence notices beside it, no source. Nothing is published.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, runner: macos-14, target: aarch64-apple-darwin }
          - { goos: darwin, goarch: amd64, runner: macos-14, target: x86_64-apple-darwin }
          - { goos: linux, goarch: amd64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { goos: windows, goarch: amd64, runner: windows-latest, target: x86_64-pc-windows-msvc, exe: .exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: scripts/build.sh ${{ matrix.goos }} ${{ matrix.goarch }} ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          go run github.com/branchkit/branchkit-cli@63b03d55ffca52e1d74204427294e7c19f88bdba plugin package . \
            --os ${{ matrix.goos }} --arch ${{ matrix.goarch }} \
            --exclude stages --exclude scripts --out dist
      - name: Check the archive
        shell: bash
        run: scripts/check-archive.sh dist/branchkit-plugin-announcements-*.tar.gz
