# Release: builds, packages, signs and publishes on every version tag.
#
# scripts/build.sh builds the plugin and its speech engine (sherpa_tts) for
# each target, the same script CI runs on every push. Packaging, checksums,
# Sigstore attestation and the upload are the shared
# branchkit/registry/release-action, identical for every plugin.
#
# No Windows on arm64: sherpa-onnx publishes no static libraries for it.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write      # upload release assets
      id-token: write      # OIDC for keyless signing
      attestations: write  # record the attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, runner: macos-14, target: aarch64-apple-darwin }
          - { goos: darwin, goarch: amd64, runner: macos-14, target: x86_64-apple-darwin }
          - { goos: linux, goarch: amd64, runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { goos: windows, goarch: amd64, runner: windows-latest, target: x86_64-pc-windows-msvc, exe: .exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: scripts/build.sh ${{ matrix.goos }} ${{ matrix.goarch }} ${{ matrix.target }}

      - name: Package, sign, release
        uses: branchkit/registry/release-action@main
        with:
          binary: announcements-plugin${{ matrix.exe }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          tag: ${{ github.ref_name }}
          exclude: stages scripts
